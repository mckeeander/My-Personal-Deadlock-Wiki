name: Update Deadlock data

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download data
        id: download
        continue-on-error: true # a failure here is handled below: yesterday's data is kept and the site says so
        run: |
          mkdir -p data prev
          cp data/heroes.json data/items.json data/item_icons.json prev/ 2>/dev/null || true # the last saved snapshot, to compare against
          grab() {
            out="data/$1"; shift
            for u in "$@"; do
              echo "Trying $u"
              code=$(curl -sS -L -o tmp.json -w "%{http_code}" "$u" || true)
              echo "  HTTP $code"
              if [ "$code" = "200" ] && python3 -c "import json,sys; d=json.load(open('tmp.json')); sys.exit(0 if isinstance(d,list) and len(d)>0 else 1)"; then
                mv tmp.json "$out"
                echo "  saved $out"
                return 0
              fi
            done
            echo "FAILED: no working address for $out"
            return 1
          }
          grab heroes.json "https://assets.deadlock-api.com/v2/heroes" "https://api.deadlock-api.com/v1/assets/heroes"
          grab items.json "https://assets.deadlock-api.com/v2/items" "https://api.deadlock-api.com/v1/assets/items"
          python3 tools/keepdeps.py prev data
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/updated.txt

      - name: Record revisions
        continue-on-error: true
        run: |
          # what changed for each hero since the last snapshot goes into data/revisions.json (shown under Revisions on hero pages)
          if [ -f prev/heroes.json ] && [ -f prev/items.json ]; then python3 tools/revisions.py prev data; fi

      - name: Trim unused fields
        # drops what the site never reads (about a third of the download); after Record revisions, which compares the full download
        continue-on-error: true
        run: python3 tools/trim.py data

      - name: Download wiki notes
        # switched off: since Nov 3 deadlock.wiki refuses automated requests (403), so these only knocked and failed every day.
        # The app keeps the last good wiki.json; new wiki content comes from pages exported by hand into data/wiki_raw/. Delete this line to switch back on.
        if: false
        continue-on-error: true
        run: |
          pip install beautifulsoup4 || pip install --break-system-packages beautifulsoup4
          python3 tools/wiki_notes.py

      - name: Download wiki pages (raw, for building new sections)
        # switched off: since Nov 3 deadlock.wiki refuses automated requests (403), so these only knocked and failed every day.
        # The app keeps the last good wiki.json; new wiki content comes from pages exported by hand into data/wiki_raw/. Delete this line to switch back on.
        if: false
        continue-on-error: true
        run: |
          python3 tools/wiki_pages.py

      - name: Patch notes and powerups (deadlock-wiki/deadlock-data, MIT)
        # The wiki's own data repo on GitHub: official patch notes and map powerup values. Plain git, so the wiki
        # site's bot check doesn't apply. Only two folders are fetched; a failure leaves the last good copies.
        continue-on-error: true
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/deadlock-wiki/deadlock-data /tmp/deadlock-data
          git -C /tmp/deadlock-data sparse-checkout set --no-cone /data/changelogs/wiki/ /data/json/ /data/localizations/english.json
          python3 tools/wikidata.py /tmp/deadlock-data

      - name: Popular items (Deadlock API match statistics)
        # what top-ranked players (about the top 5% of matches) buy on each hero over the last 30 days;
        # one request per hero, well under the API's limits. A failure leaves the last good copy.
        continue-on-error: true
        timeout-minutes: 15
        run: python3 tools/popular.py

      - name: Check the data
        # the safety net: open the site in a headless browser on today's data and make sure every hero page, item,
        # shop tab, the glossary and search still work (tools/check.py). Uses the runner's own Chrome.
        id: check
        if: steps.download.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          pip install -q playwright || pip install -q --break-system-packages playwright
          python3 tools/check.py .

      - name: Keep yesterday's data if today's failed
        # writes data/status.json, which the site reads: on a failure every data file goes back to yesterday's copy
        # and the site shows a notice saying why, and that the data is from the day before
        env:
          DOWNLOAD: ${{ steps.download.outcome }}
          CHECK: ${{ steps.check.outcome }}
        run: |
          now=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if [ "$DOWNLOAD" = "success" ] && [ "$CHECK" = "success" ]; then
            printf '{"ok":true,"checked":"%s"}\n' "$now" > data/status.json
          else
            if [ "$DOWNLOAD" != "success" ]; then reason="the game data download failed"
            else reason=$(head -n 1 check_result.txt 2>/dev/null || true); [ -n "$reason" ] || reason="the data check didn't finish"; fi
            git checkout -- data/
            git clean -fdq data/
            python3 -c "import json,sys; json.dump({'ok': False, 'checked': sys.argv[1], 'reason': sys.argv[2]}, open('data/status.json', 'w'))" "$now" "$reason"
            echo "::warning::Kept yesterday's data: $reason"
          fi

      - name: Save to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Deadlock data"
            # main can move while this job runs (for example when you upload a file), so sync and retry the push
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push attempt $i failed, retrying"; sleep 5
            done
          fi

      - name: Report a failed update
        # marks the run as failed (GitHub emails you about failed runs), after the notice and yesterday's data are saved
        if: steps.download.outcome != 'success' || steps.check.outcome != 'success'
        run: |
          echo "Today's update was not used: $(python3 -c "import json; print(json.load(open('data/status.json')).get('reason',''))")"
          exit 1
