<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14111a">
<title>Deadlock Codex</title>
<style>
:root{
  --bg:#14111a; --panel:#1d1926; --panel2:#262031; --line:#3a3248;
  --fg:#f1e9d8; --dim:#a69cb5; --gold:#e6b45a; --spirit:#b583f0; --weapon:#e8a24a; --vital:#6fc56d; --red:#e0584f;
  --disp:"Cinzel","Trajan Pro",Georgia,serif; --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0) + 8px) 12px 8px}
.bar{display:flex;gap:8px;align-items:center}
.brand{font-family:var(--disp);font-size:18px;letter-spacing:.06em;flex:1}
.ibtn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
.tabs{display:flex;gap:6px;margin-top:8px}
.tab{flex:1;padding:9px 4px;background:var(--panel);border:1px solid var(--line);border-bottom:3px solid var(--line);border-radius:8px 8px 0 0;font-size:14px}
.tab.on{background:var(--panel2);border-bottom-color:var(--gold);font-weight:600}
.tab[data-c=weapon].on{border-bottom-color:var(--weapon)} .tab[data-c=vitality].on{border-bottom-color:var(--vital)} .tab[data-c=spirit].on{border-bottom-color:var(--spirit)}
main{padding:12px;max-width:760px;margin:0 auto}
input[type=search]{width:100%;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--fg);font-size:16px;margin-bottom:12px}
.status{font-size:12px;color:var(--dim);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0;overflow:hidden;text-align:center}
.card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--panel2)}
.card span{display:block;font-size:11px;padding:4px 2px;line-height:1.2;min-height:30px}
.tier{margin:14px 0 6px;display:flex;align-items:baseline;gap:8px;font-family:var(--disp);color:var(--gold)}
.tier small{font-family:var(--body);color:var(--dim);font-size:12px}
.itiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.it{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 2px;text-align:center;font-size:11px;line-height:1.2}
.it img{width:44px;height:44px;object-fit:contain;display:block;margin:0 auto 4px}
.it.act::after{content:"ACTIVE";display:block;font-size:9px;color:var(--gold);letter-spacing:.08em;margin-top:2px}
.back{background:none;border:0;color:var(--gold);padding:6px 0;font-size:15px}
.hero-h{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.hero-h img{width:72px;aspect-ratio:3/4;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
h1{font-family:var(--disp);font-size:28px;margin:0;letter-spacing:.04em}
.sub{color:var(--dim);font-size:14px;line-height:1.4;margin:8px 0 14px}
.ab{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.abh{display:flex;gap:10px;align-items:center}
.abh img{width:44px;height:44px;object-fit:contain;flex:none}
.abh h3{margin:0;flex:1;font-size:18px;font-family:var(--disp);letter-spacing:.03em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--panel2);border-radius:5px;padding:4px 8px;font-size:13px}
.desc{font-size:15px;line-height:1.45;margin:8px 0}
.desc b,.desc .hl{color:#fff;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin:10px 0}
.stat{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center}
.sc{position:absolute;top:-9px;right:-3px;font-style:normal;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600;border:1px solid;white-space:nowrap}
.sc.sp{background:#3b2d55;color:var(--spirit)}
.sc.wp{background:#3d2a14;color:var(--weapon)}
.sc.bn{background:#1f3320;color:var(--vital)}
.hg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hc{position:relative;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel2);aspect-ratio:3/4}
.hc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hc span{position:absolute;left:0;right:0;bottom:0;padding:14px 2px 4px;font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1.1;text-align:center;color:#fff;background:linear-gradient(transparent,rgba(10,8,14,.9));overflow-wrap:anywhere}
.trow{display:flex;gap:8px;margin-bottom:8px}
.tc{flex:none;width:58px;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--disp);font-weight:700;font-size:14px;color:#fff;padding:4px 2px}
.tc.weapon{background:#a8651a}.tc.vitality{background:#3d7d3c}.tc.spirit{background:#6b45a8}
.tl{flex:1;min-width:0;display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px}
.it2{width:50%;display:flex;align-items:center;gap:8px;padding:5px 4px;background:none;border:0;text-align:left;font-size:13px;line-height:1.15;border-radius:6px;min-width:0}
.it2 img{width:34px;height:34px;object-fit:contain;flex:none;border-radius:4px;background:var(--panel2)}
.it2 em{font-style:normal;color:var(--gold);font-size:10px;letter-spacing:.06em;margin-left:4px}
.chips{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;flex-wrap:wrap}
.chips .g{display:flex;gap:6px;flex-wrap:wrap}
.chips .g:last-child{margin-left:auto}
.stat.big{border-color:var(--spirit);background:#2a2040}
.stat b{display:block;font-size:20px}
.stat i{font-style:normal;font-size:12px;color:var(--dim)}
.minor{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--dim);background:var(--panel2);border-radius:6px;padding:8px;margin:6px 0}
.minor b{color:var(--fg)}
.ups{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.up{background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:13px;text-align:center}
.up div:first-child{background:#3b2d55;color:var(--spirit);font-weight:700;padding:4px}
.up div:last-child{padding:8px 4px;line-height:1.3}
.bonus{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.cost{color:var(--vital);font-weight:700}
.pill{display:inline-block;font-size:11px;padding:2px 6px;border-radius:4px;background:var(--panel2);color:var(--dim);margin-left:6px}
dialog,.sheet{position:fixed;inset:0;background:rgba(10,8,14,.78);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .in{background:var(--bg);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom,0) + 18px);border:1px solid var(--line)}
.err{background:#3a1d1f;border:1px solid var(--red);padding:12px;border-radius:8px;font-size:14px;line-height:1.4}
pre{white-space:pre-wrap;word-break:break-all;font-size:11px;background:var(--panel);padding:8px;border-radius:6px;max-height:50vh;overflow:auto}
.link{color:var(--gold);background:none;border:0;padding:0;text-decoration:underline;font-size:12px}

.hl{color:#fff;font-weight:700}
.dm{color:var(--dim);font-style:italic}
.ia{height:1.15em;width:auto;vertical-align:-.2em;margin-right:3px}
.blk{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:12px 0 4px}
.sec{font-family:var(--disp);color:var(--gold);font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{background:#3b2230;color:#f0b8b0;border-radius:4px;padding:3px 8px;font-size:12px;letter-spacing:.04em}
details.lore{margin:4px 0 6px;color:var(--dim);font-size:14px;line-height:1.45}
details.lore summary{cursor:pointer;color:var(--gold);font-size:13px;margin-bottom:6px}
.stat.plain{border-color:var(--line);background:var(--panel2)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand" id="brand">DEADLOCK CODEX</div>
    <button class="ibtn" id="refresh" aria-label="Refresh data">⟳ Refresh</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-c="heroes">Heroes</button>
    <button class="tab" data-c="weapon">Weapon</button>
    <button class="tab" data-c="vitality">Vitality</button>
    <button class="tab" data-c="spirit">Spirit</button>
  </div>
</header>
<main id="main"></main>
<div class="sheet" id="sheet" hidden><div class="in" id="sheetin"></div></div>

<script>
"use strict";
var API = "https://assets.deadlock-api.com";
var KEY = "dlcodex.v1";
var MAX_AGE = 24 * 3600 * 1000;
var state = { heroes: [], items: [], byClass: {}, fetchedAt: 0, tab: "heroes", q: "", hero: null };
var $ = function (id) { return document.getElementById(id); };

/* ---------- helpers ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
var HERO_NAME = "";
function prettify(k) {
  return String(k).replace(/^citadel_ability_|^citadel_weapon_|^ability_/, "").replace(/_/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
}
function nameOf(it) { return it.name || prettify(it.class_name); }
function colorFor(cls, style) {
  var m = /color:\s*(#[0-9a-fA-F]{3,8})/.exec(style || "");
  if (m) return m[1];
  if (/Spirit/.test(cls)) return "var(--spirit)";
  return "";
}
// Game text carries markup, inline SVG icons and {s:...} placeholders. Keep a small safe subset.
function rich(s) {
  s = String(s == null ? "" : s);
  s = s.replace(/<svg[\s\S]*?<\/svg>/gi, "").replace(/<Panel[\s\S]*?<\/Panel>/gi, "");
  s = s.replace(/\{s:hero_name\}/g, HERO_NAME || "the hero").replace(/\{s:[^}]*\}/g, "");
  var parts = s.split(/(<[^>]*>)/), out = "";
  parts.forEach(function (p) {
    if (p.charAt(0) !== "<") { out += esc(p); return; }
    var m = /^<\s*(\/?)\s*([a-zA-Z]+)([^>]*)>/.exec(p);
    if (!m) return;
    var close = m[1] === "/", tag = m[2].toLowerCase(), attrs = m[3] || "";
    if (tag === "br") { out += "<br>"; return; }
    if (tag === "span") {
      if (close) { out += "</span>"; return; }
      var cls = (/class="([^"]*)"/.exec(attrs) || [0, ""])[1];
      var style = (/style="([^"]*)"/.exec(attrs) || [0, ""])[1];
      var col = colorFor(cls, style);
      var c = /highlight/.test(cls) ? "hl" : /diminish/.test(cls) ? "dm" : "";
      out += "<span" + (c ? ' class="' + c + '"' : "") + (col ? ' style="color:' + col + '"' : "") + ">";
      return;
    }
    if (tag === "img") {
      var src = (/src="([^"]*)"/.exec(attrs) || [0, ""])[1];
      if (/^https:\/\/assets-bucket\.deadlock-api\.com\//.test(src)) out += '<img class="ia" alt="" src="' + esc(src) + '">';
      return;
    }
    if (tag === "b" || tag === "i" || tag === "strong" || tag === "em") out += close ? "</" + tag + ">" : "<" + tag + ">";
  });
  return out;
}
function descText(d) {
  if (!d) return "";
  if (typeof d === "string") return d;
  return [d.passive, d.active, d.desc].filter(Boolean).join("<br><br>");
}
function pick(o, keys) { for (var i = 0; i < keys.length; i++) { if (o && o[keys[i]]) return o[keys[i]]; } return ""; }
function heroImg(h) { return pick(h.images, ["icon_hero_card", "icon_image_small", "selection_image", "icon_image_small_webp", "minimap_image"]) || pick(h, ["image"]); }
function itemImg(it) { return pick(it, ["image_webp", "image"]) || ""; }
function imgTag(src) { return src ? '<img alt="" src="' + esc(src) + '" onerror="this.style.display=\'none\'">' : ""; }
function save() { try { localStorage.setItem(KEY, JSON.stringify({ t: state.fetchedAt, h: state.heroes, i: state.items })); } catch (e) {} }
function load() {
  try { var d = JSON.parse(localStorage.getItem(KEY) || "null"); if (d && d.h && d.i) { state.heroes = d.h; state.items = d.i; state.fetchedAt = d.t || 0; index(); return true; } } catch (e) {}
  return false;
}
function index() {
  state.byClass = {};
  state.items.forEach(function (it) { if (it.class_name) state.byClass[it.class_name] = it; });
}
function fmtNum(v) { var n = Number(v); return isNaN(n) ? String(v) : String(Math.round(n * 100) / 100); }
function isDisabled(p) {
  if (!p || p.value == null || p.value === "") return true;
  if (p.disable_value != null && Number(p.disable_value) === Number(p.value)) return true;
  return false;
}
function unitFor(p) {
  if (p.postfix != null && p.postfix !== "") return p.postfix;
  var u = p.display_units || "";
  if (/MetersPerSecond/.test(u)) return "m/s";
  if (/Meters/.test(u)) return "m";
  if (/Seconds/.test(u)) return "s";
  if (/Percent/.test(u)) return "%";
  if (p.css_class === "cooldown" || p.css_class === "duration") return "s";
  return "";
}
function fmtVal(p) {
  if (!p || p.value == null || p.value === "") return null;
  var raw = String(p.value), n = Number(raw), isNum = !isNaN(n);
  var pre = p.prefix || "";
  if (/\{s:sign\}/.test(pre)) pre = n >= 0 ? "+" : ""; else pre = pre.replace(/\{s:[^}]*\}/g, "");
  return pre + (isNum ? fmtNum(raw) : raw) + (isNum ? unitFor(p) : "");
}
function propLabel(p, key) { return (p && (p.postvalue_label || p.label || p.display_name)) || prettify(key); }
// What does this stat scale with? Only stats the game data marks as scaling get a badge.
function scaleOf(p) {
  var sf = (p && p.scale_function) || {}, rate = Number(sf.stat_scale), st = sf.specific_stat_scale_type || "", cn = sf.class_name || "", kind = "", sub = "";
  if (!(rate > 0)) return { kind: "", rate: 0 };
  if (st === "ETechPower") kind = "spirit";
  else if (st === "EBaseWeaponDamageIncrease") kind = "weapon";
  else if (st === "EWeaponPower") { kind = "weapon"; rate = 1 + rate / 100; } // stored as a percentage: 125 -> x2.25
  else if (st === "EStatsCount" && cn === "scale_function_tech_damage") kind = "spirit"; // Rake
  else if (st === "ELevelUpBoons") kind = "boons";
  else if (st === "ELightMeleeDamage") { kind = "melee"; sub = "Light melee"; }
  else if (st === "EHeavyMeleeDamage") { kind = "melee"; sub = "Heavy melee"; }
  else if (!st) {
    if (cn === "scale_function_tech_damage" || cn === "scale_function_healing_spirit_scale") kind = "spirit";
    else if (cn === "scale_function_ability_weapon_damage") kind = "weapon";
  }
  if (cn === "scale_function_healing_boon_scale") kind = "boons";
  return { kind: kind, rate: kind ? rate : 0, sub: sub };
}
function fmtRate(v) { var n = Number(v); return isNaN(n) ? String(v) : String(Math.round(n * 1000) / 1000); }
function scaleBadge(r) {
  if (!r || !r.kind) return "";
  var n = fmtRate(r.rate);
  if (r.kind === "spirit") return '<em class="sc sp">★ ×' + esc(n) + "</em>";
  if (r.kind === "weapon") return '<em class="sc wp">Weapon ×' + esc(n) + "</em>";
  if (r.kind === "melee") return '<em class="sc wp">' + esc(r.sub) + " ×" + esc(n) + "</em>";
  return '<em class="sc bn">+' + esc(n) + "/boon</em>";
}
function propRec(it, key) {
  var p = (it.properties || {})[key];
  if (isDisabled(p)) return null;
  var n = parseFloat(p.value);
  if (!isNaN(n) && (n === 0 || (n < 0 && key === "AbilityCooldownBetweenCharge"))) return null; // inactive until an upgrade enables it
  var v = fmtVal(p);
  var sk = scaleOf(p);
  return v == null ? null : { v: v, l: propLabel(p, key), kind: sk.kind, rate: sk.rate, sub: sk.sub, tech: sk.kind === "spirit" || p.css_class === "tech_damage" };
}

/* ---------- data ---------- */
var RAW = "https://raw.githubusercontent.com/mckeeander/My-Personal-Deadlock-Wiki/main/data/";
function getJson(name) {
  var urls = [RAW + name + "?t=" + Date.now(), "data/" + name];
  function tryAt(i) {
    return fetch(urls[i], { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(name + " returned " + r.status);
      return r.json();
    }).catch(function (e) { if (i + 1 < urls.length) return tryAt(i + 1); throw e; });
  }
  return tryAt(0);
}
function fetchAll() {
  $("refresh").textContent = "…";
  return Promise.all([getJson("heroes.json"), getJson("items.json")]).then(function (r) {
    state.heroes = (Array.isArray(r[0]) ? r[0] : []).filter(function (h) { return !h.disabled && !h.in_development; });
    state.items = Array.isArray(r[1]) ? r[1] : [];
    state.heroes.sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
    state.fetchedAt = Date.now(); index(); save();
    return true;
  }).finally(function () { $("refresh").textContent = "⟳ Refresh"; });
}

/* ---------- rendering ---------- */
function statusLine() {
  var d = state.fetchedAt ? new Date(state.fetchedAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "never";
  return '<p class="status">Updated ' + esc(d) + " · " + state.heroes.length + " heroes · " + state.items.length + ' entries · <button class="link" id="dbg">data check</button></p>';
}
function renderHeroes() {
  var q = state.q.toLowerCase();
  var list = state.heroes.filter(function (h) { return !q || String(h.name).toLowerCase().indexOf(q) >= 0; });
  var html = '<input type="search" id="q" placeholder="Search heroes" value="' + esc(state.q) + '">' + statusLine() + '<div class="hg">';
  list.forEach(function (h) {
    html += '<button class="hc" data-hero="' + esc(h.class_name) + '"><img loading="lazy" alt="" src="' + esc(heroImg(h)) + '"><span>' + esc(h.name) + "</span></button>";
  });
  $("main").innerHTML = html + "</div>";
  bindCommon();
}
function statTiles(it) {
  // used by shop items (tooltip_sections)
  var big = [], small = [], used = {};
  function add(key, level) {
    if (used[key]) return;
    var r = propRec(it, key); if (!r) return;
    used[key] = 1; (level === "big" ? big : small).push(r);
  }
  (it.tooltip_sections || []).forEach(function (sec) {
    (sec.section_attributes || []).forEach(function (a) {
      (a.elevated_properties || []).forEach(function (k) { add(k, "big"); });
      (a.important_properties || []).forEach(function (k) { add(k, "big"); });
      (a.properties || []).forEach(function (k) { add(k, "small"); });
    });
  });
  return { big: big, small: small };
}
function tile(v, l, r) {
  var badge = scaleBadge(r);
  return '<div class="stat' + (r && r.tech ? " big" : "") + '">' + badge + "<b>" + esc(v) + "</b><i>" + esc(l) + "</i></div>";
}
// abilities use tooltip_details.info_sections
function tooltipHtml(it) {
  var secs = it.tooltip_details && it.tooltip_details.info_sections, html = "";
  if (!secs || !secs.length) return "";
  secs.forEach(function (sec, si) {
    if (si > 0 && sec.loc_string) html += '<div class="desc">' + rich(sec.loc_string) + "</div>";
    (sec.properties_block || []).forEach(function (blk) {
      var tiles = "";
      (blk.properties || []).forEach(function (pp) {
        if (pp.status_effect_name) {
          var sv = propRec(it, pp.status_effect_value);
          if (sv) tiles += tile(sv.v, pp.status_effect_name);
          return;
        }
        var key = pp.important_property || pp.property; if (!key) return;
        var r = propRec(it, key); if (r) tiles += tile(r.v, r.l, r);
      });
      if (tiles) html += (blk.loc_string ? '<div class="blk">' + esc(blk.loc_string) + "</div>" : "") + '<div class="stats">' + tiles + "</div>";
    });
    var minor = "";
    (sec.basic_properties || []).forEach(function (k) { var r = propRec(it, k); if (r) minor += "<span><b>" + esc(r.v) + "</b> " + esc(r.l) + scaleBadge(r) + "</span>"; });
    if (minor) html += '<div class="minor">' + minor + "</div>";
  });
  return html;
}
function chipsHtml(it) {
  var P = it.properties || {}, left = "", right = "", seen = {};
  function chip(g, text) { return '<span class="chip">' + g + " " + esc(text) + "</span>"; }
  [["AbilityDuration", "⏳"], ["AbilityCastRange", "↔"]].forEach(function (g) {
    var p = P[g[0]]; seen[g[0]] = 1;
    if (isDisabled(p) || parseFloat(p.value) === 0) return;
    left += chip(g[1], fmtVal(p));
  });
  var extra = (it.tooltip_details && it.tooltip_details.additional_header_properties) || [];
  extra.forEach(function (k) { if (seen[k]) return; var r = propRec(it, k); if (r) left += chip("•", r.v + " " + r.l); });
  var cd = P.AbilityCooldown;
  if (!isDisabled(cd) && parseFloat(cd.value) !== 0) right = chip("⟳", fmtVal(cd));
  if (!left && !right) return "";
  return '<div class="chips"><div class="g">' + left + '</div><div class="g">' + right + "</div></div>";
}
function upgradeTexts(it) {
  var d = it.description && typeof it.description === "object" ? it.description : {}, ups = it.upgrades || [], out = [];
  var KW = { ETechPower: "Spirit", EWeaponPower: "Weapon", ELevelUpBoons: "Boon" };
  for (var i = 0; i < 3; i++) {
    var k = "t" + (i + 1) + "_desc", scaleBits = [];
    ((ups[i] && ups[i].property_upgrades) || []).forEach(function (pu) {
      if (pu.upgrade_type !== "EAddToScale") return;
      var pp = (it.properties || {})[pu.name] || {}, sk = scaleOf(pp), word = KW[pu.scale_stat_filter] || (sk.kind === "spirit" ? "Spirit" : sk.kind === "weapon" ? "Weapon" : sk.kind === "boons" ? "Boon" : "");
      var bn = Number(pu.bonus);
      if (pu.scale_stat_filter === "EWeaponPower") bn = bn / 100;
      scaleBits.push(esc((bn >= 0 ? "+" : "") + fmtRate(bn) + " " + (word ? word + " " : "") + "scaling (" + propLabel(pp, pu.name) + ")"));
    });
    var extra = scaleBits.length ? '<br><span class="dm">' + scaleBits.join("<br>") + "</span>" : "";
    if (d[k]) { out.push(rich(d[k]) + extra); continue; }
    if (ups[i] && ups[i].property_upgrades) {
      var bits = [];
      ups[i].property_upgrades.forEach(function (pu) {
        if (pu.upgrade_type === "EAddToScale") return;
        var p = (it.properties || {})[pu.name] || {}, b = pu.bonus, n = Number(b);
        var sign = !isNaN(n) && n >= 0 && !/^[+-]/.test(String(b)) ? "+" : "";
        bits.push(esc(sign + fmtNum(b) + (isNaN(n) ? "" : unitFor(p)) + " " + propLabel(p, pu.name)));
      });
      out.push((bits.join("<br>") || (scaleBits.length ? "" : "—")) + extra);
    } else out.push("—");
  }
  return out;
}
function upgradesHtml(it) {
  var t = upgradeTexts(it), costs = ["1", "2", "5"], html = '<div class="ups">';
  for (var i = 0; i < 3; i++) html += '<div class="up"><div>◆ ' + costs[i] + "</div><div>" + t[i] + "</div></div>";
  return html + "</div>";
}
function abilityCard(it) {
  return '<section class="ab"><div class="abh">' + imgTag(itemImg(it)) + "<h3>" + esc(nameOf(it)) + "</h3></div>" +
    chipsHtml(it) +
    '<div class="desc">' + rich(descText(it.description && typeof it.description === "object" ? { desc: it.description.desc } : it.description)) + "</div>" +
    tooltipHtml(it) + upgradesHtml(it) + "</section>";
}
function weaponCard(h) {
  var w = state.byClass[(h.items || {}).weapon_primary];
  if (!w || !w.weapon_info) return "";
  var i = w.weapon_info, n = i.bullets > 1 ? " ×" + i.bullets : "", rate = i.cycle_time ? 1 / i.cycle_time : 0, t = "";
  if (i.bullet_damage != null) t += tile(fmtNum(i.bullet_damage) + n, "Damage per shot");
  if (i.clip_size != null) t += tile(i.clip_size, "Ammo");
  if (rate) t += tile(fmtNum(rate) + "/s", "Fire rate");
  if (i.reload_duration != null) t += tile(fmtNum(i.reload_duration) + "s", "Reload");
  var dps = (i.burst_shot_count || 1) <= 1 && rate && i.bullet_damage ? i.bullet_damage * (i.bullets || 1) * rate : 0;
  return '<section class="ab"><div class="abh">' + imgTag(itemImg(w)) + "<h3>" + esc(nameOf(w)) + "</h3>" +
    (h.gun_tag ? '<span class="chip">' + esc(h.gun_tag) + "</span>" : "") + '</div><div class="stats">' + t + "</div>" +
    (dps ? '<div class="minor"><span><b>' + fmtNum(dps) + "</b> Damage per second (all pellets hit)</span></div>" : "") + "</section>";
}
function renderHero(cn) {
  var h = state.heroes.filter(function (x) { return x.class_name === cn; })[0];
  if (!h) { state.hero = null; return renderHeroes(); }
  state.hero = cn; HERO_NAME = h.name;
  var lore = h.description && typeof h.description === "object" ? (h.description.lore || "") : (h.description || "");
  var tags = (h.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("");
  var html = '<button class="back" id="back">‹ All heroes</button><div class="hero-h"><img alt="" src="' + esc(heroImg(h)) + '"><div><h1>' + esc(h.name) + "</h1>" +
    (tags ? '<div class="tags">' + tags + "</div>" : "") + "</div></div>";
  if (lore) html += '<details class="lore"><summary>Lore</summary>' + rich(lore).replace(/(<br>)+/g, "<br><br>") + "</details>";
  var wc = weaponCard(h);
  if (wc) html += '<div class="sec">Weapon</div>' + wc;
  var it = h.items || {}, abs = ["signature1", "signature2", "signature3", "signature4"].map(function (k) { return state.byClass[it[k]]; }).filter(Boolean);
  html += '<div class="sec">Abilities</div>';
  if (!abs.length) html += '<div class="err">No abilities found for this hero.</div>';
  abs.forEach(function (a) { html += abilityCard(a); });
  $("main").innerHTML = html;
  $("back").onclick = function () { state.hero = null; render(); window.scrollTo(0, 0); };
  window.scrollTo(0, 0);
}
function slotOf(it) { return String(it.item_slot_type || "").toLowerCase(); }
function renderShop(slot) {
  var q = state.q.toLowerCase();
  var shop = state.items.filter(function (it) { return it.type === "upgrade" && slotOf(it) === slot && it.shopable !== false && !it.disabled; });
  var tiers = {};
  shop.forEach(function (it) {
    if (q && String(it.name).toLowerCase().indexOf(q) < 0) return;
    var t = it.item_tier || 0; (tiers[t] = tiers[t] || []).push(it);
  });
  var html = '<input type="search" id="q" placeholder="Search items" value="' + esc(state.q) + '">' + statusLine();
  Object.keys(tiers).sort(function (a, b) { return a - b; }).forEach(function (t) {
    var arr = tiers[t].sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
    var cost = arr[0].cost ? "$" + Number(arr[0].cost).toLocaleString() : "T" + t;
    html += '<div class="trow"><div class="tc ' + slot + '">' + esc(cost) + '</div><div class="tl">';
    arr.forEach(function (it) {
      html += '<button class="it2" data-item="' + esc(it.class_name) + '">' + imgTag(itemImg(it)) + "<div>" + esc(nameOf(it)) + (it.is_active_item ? "<em>ACTIVE</em>" : "") + "</div></button>";
    });
    html += "</div></div>";
  });
  if (!Object.keys(tiers).length) html += '<p class="status">Nothing matched. If this stays empty, open “data check”.</p>';
  $("main").innerHTML = html;
  bindCommon();
}
function itemSheet(cn) {
  var it = state.byClass[cn]; if (!it) return;
  HERO_NAME = "";
  var t = statTiles(it), tiles = "", bonus = "";
  t.big.forEach(function (x) { tiles += tile(x.v, x.l, x); });
  t.small.forEach(function (x) { bonus += '<span class="chip"><b>' + esc(x.v) + "</b> " + esc(x.l) + "</span>"; });
  var comps = (it.component_items || []).map(function (c) { return state.byClass[c] ? nameOf(state.byClass[c]) : c; });
  var html = '<div class="abh">' + imgTag(itemImg(it)) + "<h3>" + esc(nameOf(it)) + '</h3><span class="cost">' + (it.cost ? "$" + Number(it.cost).toLocaleString() : "") + "</span></div>" +
    (comps.length ? '<p class="sub">Components: ' + esc(comps.join(", ")) + "</p>" : "") +
    (bonus ? '<div class="bonus">' + bonus + "</div>" : "") + '<div class="desc">' + rich(descText(it.description)) + "</div>" +
    (tiles ? '<div class="stats">' + tiles + "</div>" : "") +
    '<button class="ibtn" id="close" style="width:100%;margin-top:10px">Close</button>';
  $("sheetin").innerHTML = html; $("sheet").hidden = false;
  $("close").onclick = closeSheet;
}
function closeSheet() { $("sheet").hidden = true; }
function debugSheet() {
  var h = state.heroes[0] || {}, it = state.items.filter(function (x) { return x.type === "ability"; })[0] || state.items[0] || {};
  var types = {}; state.items.forEach(function (x) { types[x.type] = (types[x.type] || 0) + 1; });
  var txt = "Heroes: " + state.heroes.length + "\nItems: " + state.items.length + "\nItem types: " + JSON.stringify(types) +
    "\n\nHERO FIELDS: " + Object.keys(h).join(", ") + "\nHERO.items: " + JSON.stringify(h.items) +
    "\n\nITEM FIELDS: " + Object.keys(it).join(", ") + "\n\nSAMPLE ITEM:\n" + JSON.stringify(it, null, 1).slice(0, 2500);
  $("sheetin").innerHTML = "<h3>Data check</h3><pre>" + esc(txt) + '</pre><button class="ibtn" id="close" style="width:100%">Close</button>';
  $("sheet").hidden = false; $("close").onclick = closeSheet;
}
function bindCommon() {
  var q = $("q");
  if (q) q.oninput = function () { state.q = q.value; var pos = q.selectionStart; render(); var n = $("q"); n.focus(); n.setSelectionRange(pos, pos); };
  var d = $("dbg"); if (d) d.onclick = debugSheet;
  Array.prototype.forEach.call(document.querySelectorAll("[data-hero]"), function (b) { b.onclick = function () { renderHero(b.getAttribute("data-hero")); }; });
  Array.prototype.forEach.call(document.querySelectorAll("[data-item]"), function (b) { b.onclick = function () { itemSheet(b.getAttribute("data-item")); }; });
}
function render() {
  if (state.tab === "heroes") { state.hero ? renderHero(state.hero) : renderHeroes(); } else renderShop(state.tab);
}
function showError(e) {
  $("main").innerHTML = '<div class="err"><b>Couldn’t load game data.</b><br>' + esc(e && e.message ? e.message : e) +
    "<br><br>Check your connection and tap Refresh. If it keeps failing, the data service may be down or its address may have changed.</div>";
}

/* ---------- wiring ---------- */
$("tabs").onclick = function (e) {
  var b = e.target.closest(".tab"); if (!b) return;
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (x) { x.classList.toggle("on", x === b); });
  state.tab = b.getAttribute("data-c"); state.q = ""; state.hero = null; render(); window.scrollTo(0, 0);
};
$("sheet").onclick = function (e) { if (e.target === $("sheet")) closeSheet(); };
$("refresh").onclick = function () { fetchAll().then(render).catch(showError); };

var had = load();
if (had) render(); else $("main").innerHTML = '<p class="status">Loading game data…</p>';
if (!had || Date.now() - state.fetchedAt > MAX_AGE) {
  fetchAll().then(render).catch(function (e) { if (!had) showError(e); });
}
</script>
</body>
